<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserve a table · Cuban Diner</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13302E">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#13302E;--crema:#EEECE8;--naranja:#EA6232;--amarillo:#FDC413}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',Arial,sans-serif;background:var(--verde);color:var(--crema);text-align:center;padding:40px 20px;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto}
.logo{width:170px;display:block;margin:0 auto 22px}
h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:44px;line-height:1}
p{margin-top:12px;font-weight:600}
.btn{display:block;margin-top:16px;text-decoration:none;font-weight:800;letter-spacing:.06em;border-radius:50px;padding:17px 20px}
.a{background:var(--naranja);color:var(--crema);margin-top:28px}
.b{background:var(--amarillo);color:var(--verde)}
small{display:block;margin-top:26px;opacity:.85}
small a{color:var(--amarillo);font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="assets/cuban-diner-logo-crema.png" alt="Cuban Diner">
  <h1>Reserve a table</h1>
  <p>1484 Roswell Rd, Marietta, GA</p>
  <a class="btn a" href="https://forms.gle/5Uurt7YtQeqe5u5W6">RESERVE A TABLE</a>
  <a class="btn b" href="https://forms.gle/uBb3cU6tdfDdL5tp6">SALSA NIGHT · SAT, OCT 17</a>
  <small>Parties of more than 10: call <a href="tel:+17705092576">(770) 509-2576</a></small>
</div>
</body>
</html>
